env:
  PACKAGE_ID: headful-chromium
  PLAYWRIGHT_VERSION: 1.64.1
on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/headful-chromium.yml
      - packages/headful-chromium/**
jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      PACKAGE_ID: ${{ steps.e.outputs.PACKAGE_ID }}
    steps:
    - id: e
      run: |
        echo "PACKAGE_ID=${{ env.PACKAGE_ID }}" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v7
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - id: meta_debian12
      uses: docker/metadata-action@v6
      with:
        images: |
          sstc/${{ env.PACKAGE_ID }}
        tags: |
          type=raw,value=debian-12
    - uses: docker/build-push-action@v7
      with:
        context: ./packages/${{ env.PACKAGE_ID }}
        push: true
        platforms: linux/amd64,linux/arm64
        file: ./packages/${{ env.PACKAGE_ID }}/debian-12/Dockerfile
        tags: ${{ steps.meta_debian12.outputs.tags }}
        build-args: |
          PLAYWRIGHT_VERSION=${{ env.PLAYWRIGHT_VERSION }}
    - id: meta_debian13
      uses: docker/metadata-action@v6
      with:
        images: |
          sstc/${{ env.PACKAGE_ID }}
        tags: |
          type=raw,value=debian
          type=raw,value=debian-13
    - uses: docker/build-push-action@v7
      with:
        context: ./packages/${{ env.PACKAGE_ID }}
        push: true
        platforms: linux/amd64,linux/arm64
        file: ./packages/${{ env.PACKAGE_ID }}/debian-13/Dockerfile
        tags: ${{ steps.meta_debian13.outputs.tags }}
        build-args: |
          PLAYWRIGHT_VERSION=${{ env.PLAYWRIGHT_VERSION }}
    - id: meta_ubuntu22
      uses: docker/metadata-action@v6
      with:
        images: |
          sstc/${{ env.PACKAGE_ID }}
        tags: |
          type=raw,value=ubuntu-22
    - uses: docker/build-push-action@v7
      with:
        context: ./packages/${{ env.PACKAGE_ID }}
        push: true
        platforms: linux/amd64,linux/arm64
        file: ./packages/${{ env.PACKAGE_ID }}/ubuntu-22/Dockerfile
        tags: ${{ steps.meta_ubuntu22.outputs.tags }}
        build-args: |
          PLAYWRIGHT_VERSION=${{ env.PLAYWRIGHT_VERSION }}
    - id: meta_ubuntu24
      uses: docker/metadata-action@v6
      with:
        images: |
          sstc/${{ env.PACKAGE_ID }}
        tags: |
          type=raw,value=ubuntu-24
    - uses: docker/build-push-action@v7
      with:
        context: ./packages/${{ env.PACKAGE_ID }}
        push: true
        platforms: linux/amd64,linux/arm64
        file: ./packages/${{ env.PACKAGE_ID }}/ubuntu-24/Dockerfile
        tags: ${{ steps.meta_ubuntu24.outputs.tags }}
        build-args: |
          PLAYWRIGHT_VERSION=${{ env.PLAYWRIGHT_VERSION }}
    - id: meta_ubuntu26
      uses: docker/metadata-action@v6
      with:
        images: |
          sstc/${{ env.PACKAGE_ID }}
        tags: |
          type=raw,value=latest
          type=raw,value=ubuntu
          type=raw,value=ubuntu-26
    - uses: docker/build-push-action@v7
      with:
        context: ./packages/${{ env.PACKAGE_ID }}
        push: true
        platforms: linux/amd64,linux/arm64
        file: ./packages/${{ env.PACKAGE_ID }}/ubuntu-26/Dockerfile
        tags: ${{ steps.meta_ubuntu26.outputs.tags }}
        build-args: |
          PLAYWRIGHT_VERSION=${{ env.PLAYWRIGHT_VERSION }}
    - uses: christian-korneck/update-container-description-action@v1
      env:
        DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKER_PASS: ${{ secrets.DOCKERHUB_PASSWORD }}
      with:
        destination_container_repo: sstc/${{ env.PACKAGE_ID }}
        short_description: https://github.com/${{ github.repository }}/tree/master/packages/${{ env.PACKAGE_ID }}
        readme_file: './packages/${{ env.PACKAGE_ID }}/README.md'
  notify:
    if: cancelled() == false
    needs: deploy
    secrets: inherit
    uses: ./.github/workflows/_notify.yml
    with:
      conclusion: ${{ needs.deploy.result }}
      package: ${{ needs.deploy.outputs.PACKAGE_ID }}
